name: release

# A tag like v0.2.0 is the only thing that produces a downloadable build. The
# job runs the exact `scripts/build.sh release` a maintainer would run, then
# publishes whatever the script left in dist/ -- archives plus SHA256SUMS -- so
# there is no second, CI-only packaging path to drift out of sync.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release artefacts are only published if the tests pass, so a tagged commit
  # that does not build never reaches users.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format, vet and test
        run: SKIP_WEB=1 bash scripts/build.sh test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is read back with `git describe`, which needs the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build every platform and package
        run: bash scripts/build.sh release

      # A hand-written summary is what a visitor reads first; the commit-level
      # changelog GitHub generates is appended to it. Keeping the summary in a
      # per-tag file means a release without one still works: the step finds no
      # file, the output stays empty, and only the generated notes are shown.
      - name: Pick the hand-written release notes for this tag
        id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            {
              echo 'body<<__NOTES__'
              cat "$f"
              echo '__NOTES__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codenexus_*
            dist/SHA256SUMS
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag carrying a pre-release marker (v0.0.1-dev, v0.2.0-rc.1) is
          # published as one, so "latest release" never points at a build that
          # still says -dev.
          prerelease: ${{ contains(github.ref_name, '-') }}
